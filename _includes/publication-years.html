{% assign publication_index = site.data.publication_index_urls[page.lang] %}
<nav aria-label="{{ site.data.i18n.publication_years[page.lang] }}">
  <ul class="publication-years-list">
    <li><a href="{{ publication_index | relative_url }}"{% unless page.year %} aria-current="page"{% endunless %}>{{ site.data.i18n.all_publications[page.lang] }}</a></li>
    {% for archive in site.data.publication_years %}
    <li><a href="{{ archive.urls[page.lang] | relative_url }}"{% if page.year == archive.year %} aria-current="page"{% endif %}>{{ archive.year }}</a></li>
    {% endfor %}
  </ul>
</nav>
