items:
- title:
    zh: 计算凝聚态物理
    en: Computational condensed matter physics
  description:
    zh: 第一性原理计算、能带结构、态密度、Wannier 函数与有效模型。
    en: First-principles calculations, band structures, density of states, Wannier functions, and effective models.
- title:
    zh: AI/ML 材料方法
    en: AI/ML methods for materials
  description:
    zh: 材料数据、物理启发特征、机器学习模型、可解释性与材料筛选。
    en: Materials data, physics-informed descriptors, machine-learning models, interpretability, and materials screening.
items_heading:
  zh: 拟建设课程
  en: Planned courses
training:
  title:
    zh: 科研训练
    en: Research training
  description:
    zh: 面向本科生和研究生的文献阅读、代码训练、计算流程和科研表达。
    en: Literature reading, coding practice, computational workflows, and scientific communication for undergraduate and graduate students.
future_heading:
  zh: 后续计划
  en: Future plans
future_text:
  zh: 课题组将逐步整理课程讲义、计算教程、代码模板和学生科研训练项目，方便新成员快速进入研究。
  en: The group will gradually organize lecture notes, computational tutorials, code templates, and student research-training projects to help new members get started efficiently.
