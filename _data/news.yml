    en: Research Training
  title:
    zh: 本科生科研训练开放咨询
    en: Undergraduate research training inquiries are welcome
  body:
    zh: 欢迎具备物理、材料、计算或编程兴趣的本科生参与文献阅读、计算流程和数据分析训练。
