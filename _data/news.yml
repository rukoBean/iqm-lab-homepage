  label:
    zh: 2026 · 荣誉奖项
    en: 2026 · Honors and Awards
  title:
    zh: 祝贺课题组博士生陈静妍荣获博士新生奖
    en: Congratulations to our PhD student Jing-Yan Chen on receiving the New Doctoral Student Award
  body:
    zh: 祝贺课题组一年级博士生陈静妍荣获东南大学物理学院2026级博士新生奖！详情请见[获奖名单公示](https://physics.seu.edu.cn/2026/1020/c23142a586756/page.htm)。
    en: Congratulations to our junior PhD student Jing-Yan Chen on receiving the New Doctoral Student Award for the 2026 entering cohort from the School of Physics at Southeast University! Please see the [award announcement](https://physics.seu.edu.cn/2026/1020/c23142a586756/page.htm) for details.
  homepage: true
