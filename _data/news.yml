  title:
    zh: 智能量子材料课题组欢迎新成员加入
    en: IQM Lab welcomes new members
  body:
    zh: 欢迎对凝聚态理论、计算材料、AI/ML for materials 感兴趣的博士后、博士生、硕士生和本科生联系。
    en: Postdoctoral researchers, PhD students, master students, and undergraduate researchers interested in condensed matter theory, computational materials, and AI/ML for materials are welcome to contact us.
  homepage: true
- id: news-5
  date: ""
  pin: false
  label:
    zh: 2026 · 论文发表
    en: 2026 · Publication
  title:
    zh: 祝贺课题组与吕冰教授合作论文发表于 PRL
    en: Congratulations on our collaborative PRL publication with Prof. Bing Lv
  body:
    zh: 祝贺林玲芳教授与德州大学达拉斯分校吕冰教授合作论文 [“Block-Type Antiferromagnetism in Single Chain Quasi-One-Dimensional K3Fe2Se4”](https://doi.org/10.1103/g8zx-gc2t) 发表于 *Physical Review Letters*。
    en: Congratulations to Prof. Lingfang Lin and Prof. Bing Lv at The University of Texas at Dallas on their collaborative paper [“Block-Type Antiferromagnetism in Single Chain Quasi-One-Dimensional K3Fe2Se4”](https://doi.org/10.1103/g8zx-gc2t), published in *Physical Review Letters*.
  homepage: true
