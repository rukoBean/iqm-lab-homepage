- id: news-3
  date: ""
  pin: false
  label:
    zh: 方向亮点
    en: Research Highlight
  title:
    zh: AI/ML 驱动量子材料发现
    en: AI/ML-driven quantum materials discovery
  body:
    zh: 发展物理启发机器学习方法，结合第一性原理计算和多体模型，探索新型超导、磁性与多铁材料。
    en: We develop physics-informed machine-learning methods and combine them with first-principles calculations and many-body models to explore novel superconducting, magnetic, and multiferroic materials.
  homepage: true
