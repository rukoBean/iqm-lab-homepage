- id: lingfang-lin
  name:
    zh: 林玲芳 / Ling-Fang Lin
    en: Ling-Fang Lin / 林玲芳
  role:
    zh: 课题组负责人
    en: Principal Investigator
  bio:
    zh: 研究兴趣包括强关联电子材料、高温超导、磁性、多铁性、第一性原理计算与多体数值模拟。课题组致力于把可解释的物理机制、先进计算方法与 AI/ML 材料发现相结合，探索新型量子材料中的电子结构、磁电耦合和非常规超导机制。
    en: Research interests include strongly correlated electronic materials, high-temperature superconductivity, magnetism, multiferroicity, first-principles calculations, and many-body numerical simulations. The group combines interpretable physical mechanisms, advanced computational methods, and AI/ML-driven materials discovery.
  photo: /assets/images/portrait.webp
